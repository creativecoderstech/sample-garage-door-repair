openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Garage door repair customer and operations API
servers:
  - url: /api
tags:
  - name: health
  - name: public
  - name: requests
  - name: admin
  - name: assistant
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /garage/services:
    get:
      operationId: listGarageServices
      tags: [public]
      responses:
        "200":
          description: Service catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GarageService" }
  /garage/testimonials:
    get:
      operationId: listTestimonials
      tags: [public]
      responses:
        "200":
          description: Customer testimonials
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Testimonial" }
  /garage/reviews:
    get:
      operationId: getGoogleReviewFeed
      tags: [public]
      responses:
        "200":
          description: Google Business Profile review presentation feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleReviewFeed"
  /garage/availability:
    get:
      operationId: getAvailability
      tags: [public]
      parameters:
        - in: query
          name: zip
          required: true
          schema: { type: string, minLength: 5, maxLength: 10 }
      responses:
        "200":
          description: Service area and next appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }
  /garage/site-settings:
    get:
      operationId: getPublicBusinessSettings
      tags: [public]
      responses:
        "200":
          description: Public business settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicBusinessSettings" }
  /garage/content:
    get:
      operationId: listGarageContent
      tags: [public]
      responses:
        "200":
          description: Published, publicly safe website content
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GarageContent" }
  /garage/admin/session:
    get:
      operationId: getGarageAdminSession
      tags: [admin]
      responses:
        "200":
          description: Current request-time staff authorization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GarageStaffSession" }
  /garage/admin/access:
    get:
      operationId: listGarageStaffAccess
      tags: [admin]
      responses:
        "200":
          description: Authorized and pending staff access
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GarageAccessGrant" }
    post:
      operationId: grantGarageStaffAccess
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GarageAccessGrantInput" }
      responses:
        "201":
          description: Staff access granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GarageAccessGrant" }
  /garage/admin/access/{id}:
    delete:
      operationId: revokeGarageStaffAccess
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "204":
          description: Staff access revoked
  /garage/admin/content:
    get:
      operationId: listAdminGarageContent
      tags: [admin]
      responses:
        "200":
          description: All website content
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GarageContent" }
    post:
      operationId: createGarageContent
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GarageContentInput" }
      responses:
        "201":
          description: Content created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GarageContent" }
  /garage/admin/content/{id}:
    put:
      operationId: updateGarageContent
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GarageContentInput" }
      responses:
        "200":
          description: Content updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GarageContent" }
    delete:
      operationId: deleteGarageContent
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "204":
          description: Content deleted
  /garage/requests:
    get:
      operationId: listServiceRequests
      tags: [admin]
      responses:
        "200":
          description: All service requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminServiceRequest" }
    post:
      operationId: createServiceRequest
      tags: [requests]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 20, maxLength: 100, pattern: "^[A-Za-z0-9_-]+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceRequestInput" }
      responses:
        "200":
          description: Existing request returned for an idempotent retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GarageCreatedRequest" }
        "201":
          description: Request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GarageCreatedRequest" }
  /garage/requests/{id}:
    patch:
      operationId: updateServiceRequest
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceRequestUpdate" }
      responses:
        "200":
          description: Request updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceRequest" }
  /garage/request-uploads/{id}/prepare:
    post:
      operationId: prepareServiceRequestAttachment
      tags: [requests]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number }
        - in: header
          name: X-Upload-Capability
          required: true
          schema: { type: string, minLength: 32 }
        - in: header
          name: Idempotency-Key
          required: true
          description: Stable key for this selected file; reuse it when retrying prepare or upload.
          schema: { type: string, minLength: 20, maxLength: 100, pattern: "^[A-Za-z0-9_-]+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrepareRequestAttachmentInput" }
      responses:
        "200":
          description: Existing private file reservation returned for an idempotent retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreparedRequestAttachment" }
        "201":
          description: Private upload prepared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreparedRequestAttachment" }
  /garage/request-uploads/{id}/attachments/{attachmentId}/finalize:
    post:
      operationId: finalizeServiceRequestAttachment
      tags: [requests]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number }
        - in: path
          name: attachmentId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Upload-Capability
          required: true
          schema: { type: string, minLength: 32 }
      responses:
        "200":
          description: Upload verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinalizeRequestAttachmentResponse" }
  /garage/request-uploads/{id}/complete:
    post:
      operationId: completeServiceRequestUploads
      tags: [requests]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number }
        - in: header
          name: X-Upload-Capability
          required: true
          schema: { type: string, minLength: 32 }
      responses:
        "200":
          description: Upload phase completed and notification delivery attempted once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestDeliveryDetails" }
  /garage/requests/{id}/attachments/{attachmentId}:
    get:
      operationId: getServiceRequestAttachment
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number }
        - in: path
          name: attachmentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Private attachment bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /garage/requests/{id}/notify:
    post:
      operationId: retryServiceRequestNotification
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Delivery retry completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestDeliveryDetails" }
  /garage/admin/notifications:
    get:
      operationId: getGarageNotificationSettings
      tags: [admin]
      responses:
        "200":
          description: Request delivery settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GarageNotificationSettings" }
    put:
      operationId: updateGarageNotificationSettings
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GarageNotificationSettingsInput" }
      responses:
        "200":
          description: Request delivery settings saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GarageNotificationSettings" }
  /garage/admin/notifications/test:
    post:
      operationId: testGarageNotificationDestination
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GarageNotificationTestInput" }
      responses:
        "200":
          description: A real test event was accepted by the destination
          content:
            application/json:
              schema:
                type: object
                required: [delivered]
                properties:
                  delivered: { type: boolean, enum: [true] }
  /garage/dashboard:
    get:
      operationId: getGarageDashboard
      tags: [admin]
      responses:
        "200":
          description: Operations summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
  /garage/settings:
    get:
      operationId: getBusinessSettings
      tags: [admin]
      responses:
        "200":
          description: Business settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessSettings" }
    patch:
      operationId: updateBusinessSettings
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessSettingsInput" }
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessSettings" }
  /garage/assistant:
    post:
      operationId: askGarageAssistant
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantInput" }
      responses:
        "200":
          description: Assistant response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantReply" }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    GarageStaffRole:
      type: string
      enum: [super_admin, admin, staff]
    GarageAccessGrantRole:
      type: string
      enum: [admin, staff]
    GarageStaffSession:
      type: object
      required: [accessId, userId, email, role]
      properties:
        accessId: { type: string }
        userId: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/GarageStaffRole" }
    GarageAccessGrantInput:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        role: { $ref: "#/components/schemas/GarageAccessGrantRole" }
    GarageAccessGrant:
      type: object
      required: [id, email, role, status]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/GarageStaffRole" }
        status: { type: string, enum: [pending, active] }
        protectedOwner: { type: boolean }
        createdAt: { type: string }
        redeemedAt: { type: ["string", "null"] }
    GarageService:
      type: object
      required: [id, slug, name, description, startingPrice, duration, emergency]
      properties:
        id: { type: number }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        startingPrice: { type: ["number", "null"] }
        duration: { type: string }
        emergency: { type: boolean }
    Testimonial:
      type: object
      required: [id, name, city, rating, quote, service]
      properties:
        id: { type: number }
        name: { type: string }
        city: { type: string }
        rating: { type: number }
        quote: { type: string }
        service: { type: string }
    GoogleReview:
      type: object
      required: [id, reviewerName, rating, comment, publishedAt, relativeTime, source]
      properties:
        id: { type: string }
        reviewerName: { type: string }
        reviewerPhotoUrl: { type: ["string", "null"] }
        rating: { type: number, minimum: 1, maximum: 5 }
        comment: { type: string }
        publishedAt: { type: string }
        relativeTime: { type: string }
        source: { type: string, enum: [google] }
    GoogleReviewFeed:
      type: object
      required: [mode, connectionStatus, locationName, aggregateRating, totalReviewCount, lastSyncedAt, reviews]
      properties:
        mode: { type: string, enum: [demo, live] }
        connectionStatus: { type: string, enum: [disconnected, connected, permission_error, unavailable] }
        locationName: { type: string }
        aggregateRating: { type: number }
        totalReviewCount: { type: number }
        lastSyncedAt: { type: ["string", "null"] }
        profileUrl: { type: ["string", "null"] }
        reviews:
          type: array
          items: { $ref: "#/components/schemas/GoogleReview" }
    Availability:
      type: object
      required: [available, zip, eta, message]
      properties:
        available: { type: boolean }
        zip: { type: string }
        eta: { type: string }
        message: { type: string }
    GarageContent:
      type: object
      required: [id, kind, slug, aliases, title, navigationLabel, navigationGroup, summary, body, symptoms, expectations, serviceFaqs, imageUrl, imageAlt, mediaMetadata, beforeImageUrl, seoTitle, seoDescription, parentId, sortOrder, status, verificationStatus, featured, serviceCode, reviewedSeed, updatedAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [page, service, location, article, faq, project, trust] }
        slug: { type: string }
        aliases:
          type: array
          items: { type: string }
        title: { type: string }
        navigationLabel: { type: string }
        navigationGroup: { type: string }
        summary: { type: string }
        body: { type: string }
        symptoms:
          type: array
          items: { type: string }
        expectations:
          type: array
          items: { type: string }
        serviceFaqs:
          type: array
          items: { $ref: "#/components/schemas/GarageServiceFaq" }
        imageUrl: { type: string }
        imageAlt: { type: string }
        mediaMetadata: { $ref: "#/components/schemas/GarageMediaMetadata" }
        beforeImageUrl: { type: string }
        seoTitle: { type: string }
        seoDescription: { type: string }
        parentId: { type: ["string", "null"] }
        sortOrder: { type: number, multipleOf: 1 }
        status: { type: string, enum: [draft, published] }
        verificationStatus: { type: string, enum: [unverified, verified] }
        featured: { type: boolean }
        serviceCode: { type: string }
        reviewedSeed: { type: boolean, readOnly: true }
        updatedAt: { type: string }
    GarageContentInput:
      type: object
      required: [kind, slug, aliases, title, navigationLabel, navigationGroup, summary, body, symptoms, expectations, serviceFaqs, imageUrl, imageAlt, mediaMetadata, beforeImageUrl, seoTitle, seoDescription, sortOrder, status, verificationStatus, featured, serviceCode]
      properties:
        kind: { type: string, enum: [page, service, location, article, faq, project, trust] }
        slug: { type: string, minLength: 1, maxLength: 100, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        aliases:
          type: array
          maxItems: 25
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 100, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        title: { type: string, minLength: 1, maxLength: 160 }
        navigationLabel: { type: string, maxLength: 100 }
        navigationGroup: { type: string, maxLength: 100, pattern: "^(?:[a-z0-9]+(?:-[a-z0-9]+)*)?$" }
        summary: { type: string, maxLength: 500 }
        body: { type: string, maxLength: 20000 }
        symptoms:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 300 }
        expectations:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 300 }
        serviceFaqs:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/GarageServiceFaq" }
        imageUrl: { type: string, maxLength: 2048 }
        imageAlt: { type: string, maxLength: 300 }
        mediaMetadata: { $ref: "#/components/schemas/GarageMediaMetadata" }
        beforeImageUrl: { type: string, maxLength: 2048 }
        seoTitle: { type: string, maxLength: 160 }
        seoDescription: { type: string, maxLength: 320 }
        parentId: { type: ["string", "null"], maxLength: 100 }
        sortOrder: { type: number, multipleOf: 1, minimum: -100000, maximum: 100000 }
        status: { type: string, enum: [draft, published] }
        verificationStatus: { type: string, enum: [unverified, verified] }
        featured: { type: boolean }
        serviceCode: { type: string, maxLength: 100, pattern: "^(?:[a-z0-9]+(?:-[a-z0-9]+)*)?$" }
        verificationAcknowledged:
          type: boolean
    GarageServiceFaq:
      type: object
      required: [question, answer]
      properties:
        question: { type: string, minLength: 1, maxLength: 300 }
        answer: { type: string, minLength: 1, maxLength: 1000 }
    GarageMediaMetadata:
      type: object
      required: [sourceUrl, license, attribution, representative]
      properties:
        sourceUrl: { type: string, maxLength: 2048 }
        license: { type: string, maxLength: 500 }
        attribution: { type: string, maxLength: 500 }
        representative: { type: boolean }
    ServiceRequest:
      type: object
      required: [id, customerName, phone, email, streetAddress, city, state, zip, service, urgency, status, preferredDate, preferredTime, createdAt]
      properties:
        id: { type: number }
        customerName: { type: string }
        phone: { type: string }
        email: { type: string }
        streetAddress: { type: string }
        city: { type: string }
        state: { type: string }
        zip: { type: string }
        service: { type: string }
        urgency: { type: string, enum: [emergency, soon, flexible] }
        status: { type: string, enum: [new, scheduled, dispatched, completed] }
        preferredDate: { type: string }
        preferredTime: { type: string }
        details: { type: string }
        createdAt: { type: string }
    RequestAttachment:
      type: object
      required: [id, originalName, contentType, byteSize, status]
      properties:
        id: { type: string, format: uuid }
        originalName: { type: string }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, video/mp4, video/quicktime, video/webm] }
        byteSize: { type: integer }
        status: { type: string, enum: [pending, uploaded] }
    NotificationDelivery:
      type: object
      required: [id, requestId, status, attempts, deliveredAt, lastError, updatedAt]
      properties:
        id: { type: string, format: uuid }
        requestId: { type: number }
        status: { type: string, enum: [pending_uploads, unconfigured, pending, processing, failed, delivered] }
        attempts: { type: integer }
        lastError: { type: string, nullable: true }
        deliveredAt: { type: string, nullable: true }
        updatedAt: { type: string }
    RequestDeliveryDetails:
      type: object
      required: [uploadStatus, delivery, attachments]
      properties:
        uploadStatus: { type: string, enum: [incomplete, completed] }
        delivery:
          allOf:
            - $ref: "#/components/schemas/NotificationDelivery"
          nullable: true
        attachments:
          type: array
          items: { $ref: "#/components/schemas/RequestAttachment" }
    AdminServiceRequest:
      allOf:
        - $ref: "#/components/schemas/ServiceRequest"
        - $ref: "#/components/schemas/RequestDeliveryDetails"
    GarageNotificationTestInput:
      type: object
      required: [webhookUrl]
      properties:
        webhookUrl: { type: string, format: uri }
    GarageCreatedRequest:
      allOf:
        - $ref: "#/components/schemas/ServiceRequest"
        - $ref: "#/components/schemas/RequestDeliveryDetails"
        - type: object
          required: [uploadCapability]
          properties:
            uploadCapability:
              type: string
              minLength: 32
              description: Short-lived private attachment capability returned only to the submitting customer.
    PrepareRequestAttachmentInput:
      type: object
      required: [originalName, contentType, byteSize]
      properties:
        originalName: { type: string, minLength: 1, maxLength: 180 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, video/mp4, video/quicktime, video/webm] }
        byteSize: { type: integer, minimum: 1, maximum: 104857600 }
    PreparedRequestAttachment:
      type: object
      required: [attachmentId, uploadUrl, method, headers, status]
      properties:
        attachmentId: { type: string, format: uuid }
        uploadUrl: { type: string }
        status: { type: string, enum: [pending, uploaded] }
        method: { type: string, enum: [PUT] }
        headers:
          type: object
          additionalProperties: { type: string }
    FinalizeRequestAttachmentResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [uploaded] }
    GarageNotificationSettings:
      type: object
      required: [id, webhookUrl, enabled, configured, destinationVerified, testedAt]
      properties:
        id: { type: integer, enum: [1] }
        webhookUrl: { type: string, nullable: true }
        enabled: { type: boolean }
        configured: { type: boolean }
        destinationVerified: { type: boolean }
        testedAt: { type: string, nullable: true }
        updatedAt: { type: string }
    GarageNotificationSettingsInput:
      type: object
      required: [webhookUrl, enabled]
      properties:
        webhookUrl: { type: string, nullable: true }
        enabled: { type: boolean }
    ServiceRequestInput:
      type: object
      required: [customerName, phone, email, streetAddress, city, state, zip, service, urgency, preferredDate]
      properties:
        customerName: { type: string, minLength: 2 }
        phone: { type: string, minLength: 7 }
        email: { type: string }
        streetAddress: { type: string, minLength: 3 }
        city: { type: string, minLength: 2 }
        state: { type: string, minLength: 2, maxLength: 2 }
        zip: { type: string, minLength: 5 }
        service: { type: string }
        urgency: { type: string, enum: [emergency, soon, flexible] }
        preferredDate: { type: string }
        preferredTime: { type: string }
        details: { type: string }
        turnstileToken: { type: string }
    ServiceRequestUpdate:
      type: object
      properties:
        status: { type: string, enum: [new, scheduled, dispatched, completed] }
        preferredDate: { type: string }
        preferredTime: { type: string }
        details: { type: string }
    DashboardSummary:
      type: object
      required: [newRequests, scheduledToday, emergencyCalls, completedThisWeek, estimatedRevenue, requests]
      properties:
        newRequests: { type: number }
        scheduledToday: { type: number }
        emergencyCalls: { type: number }
        completedThisWeek: { type: number }
        estimatedRevenue: { type: number }
        requests:
          type: array
          items: { $ref: "#/components/schemas/ServiceRequest" }
    BusinessSettings:
      type: object
