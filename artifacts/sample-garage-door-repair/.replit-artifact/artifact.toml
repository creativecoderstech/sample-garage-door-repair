kind = "web"
previewPath = "/"
title = "Cumming Garage Door Service"
description = "Commercial garage-door services, secure Google staff administration, private customer requests and Maya assistance. Public launch awaits owner-verified business and production settings."
version = "1.0.0"
id = "artifacts/sample-garage-door-repair"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22004

[services.development]
run = "pnpm --filter @workspace/sample-garage-door-repair run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sample-garage-door-repair", "run", "build" ]
serve = "static"
publicDir = "artifacts/sample-garage-door-repair/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22004"
BASE_PATH = "/"
