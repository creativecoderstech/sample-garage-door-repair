openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Penny Lane Home Solutions API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bookings
    description: Confirmed schedule appointments (approved from service requests)
  - name: service-requests
    description: Client service requests awaiting owner confirmation
  - name: chat
    description: AI chat assistant and captured chat inquiries
  - name: reviews
    description: Customer review operations
  - name: tasks
    description: Before and after task gallery (admin write APIs are unauthenticated for now)
  - name: settings
    description: Public site settings (phone number, etc.). Write APIs are unauthenticated for now.
  - name: gallery
    description: Homepage Gallery photos (admin write APIs are unauthenticated for now)
  - name: faqs
    description: Homepage FAQs (public list of published; writes require staff auth)
  - name: auth
    description: Google Sign-In session for the admin dashboard
  - name: users
    description: Super Admin user management (add Admins and Members)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /service-requests:
    get:
      operationId: listServiceRequests
      tags: [service-requests]
      summary: List service requests
      description: Paginated admin list. Newest first.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, pending, contacted, converted, declined, all]
          description: "open = pending + contacted (default admin queue; excludes converted/declined). all = every status."
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated service requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestList"
    post:
      operationId: createServiceRequest
      tags: [service-requests]
      summary: Submit a service request
      description: Public multipart form. Creates a pending request for owner review (not a confirmed booking). Optional photos (JPEG/PNG/WebP, max 5, 5MB each) stored in R2.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ServiceRequestInput"
      responses:
        "201":
          description: Service request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /service-requests/summary:
    get:
      operationId: getServiceRequestSummary
      tags: [service-requests]
      summary: Service request stats summary
      description: Counts for admin badges and homepage social proof
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestSummary"
  /service-requests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateServiceRequest
      tags: [service-requests]
      summary: Update a service request status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequestUpdateInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /service-requests/phone:
    post:
      operationId: createPhoneBooking
      tags: [service-requests]
      summary: Record a phone booking
      description: Admin-only. Creates a service request (source=phone, status=converted) and a confirmed booking in one step. Fires a confirmation email if the client provided an email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneBookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneBookingResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /service-requests/{id}/confirm:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: confirmServiceRequest
      tags: [service-requests]
      summary: Confirm a service request into a booking
      description: Creates a confirmed booking, marks the request converted, and notifies the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmServiceRequestInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmServiceRequestResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Request already converted or declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List confirmed bookings
      description: Date-sorted confirmed schedule for admin.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
  /bookings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateBooking
      tags: [bookings]
      summary: Update booking status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingUpdateInput"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /google-reviews:
    get:
      operationId: listGoogleReviews
      tags: [reviews]
      summary: List synced Google reviews
      description: Returns reviews synced from the Google Places API by the daily cron job. Returns an empty array when no Place ID is configured or no sync has run yet.
      responses:
        "200":
          description: Array of synced Google reviews (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoogleReview"
  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List customer reviews
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a customer review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /chat:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message to the AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /chat/inquiries:
    get:
      operationId: listChatInquiries
      tags: [chat]
      summary: List chat inquiries
      description: Paginated list for the admin console. Newest first. Only the last 7 days are retained.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated chat inquiries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatInquiryList"
    post:
      operationId: createChatInquiry
      tags: [chat]
      summary: Start a chat inquiry
      description: Capture visitor name and optional phone before chatting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInquiryInput"
      responses:
        "201":
          description: Inquiry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatInquiry"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /chat/inquiries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateChatInquiry
      tags: [chat]
      summary: Update a chat inquiry status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInquiryUpdateInput"
      responses:
        "200":
          description: Inquiry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatInquiry"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteChatInquiry
      tags: [chat]
      summary: Delete a chat inquiry
      description: Permanently deletes a chat inquiry and its transcript. Unauthenticated for now — add token auth later.
      responses:
        "204":
          description: Deleted
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List before/after tasks
      description: Paginated list. Published only by default; pass all=1 for admin (includes drafts).
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: string
            enum: ["0", "1"]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 12
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a before/after task
      description: Multipart form with before/after images. Unauthenticated for now — add token auth later.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TaskCreateInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: number
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a single task
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateTask
      tags: [tasks]
      summary: Update a before/after task
      description: Multipart form. Image fields optional. Unauthenticated for now — add token auth later.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TaskUpdateInput"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a before/after task
      description: Deletes metadata and R2 images. Unauthenticated for now — add token auth later.
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Current admin session user
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Clear admin session cookie
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List admin users
      description: Super Admin only.
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createUser
      tags: [users]
      summary: Add Admin or Member
      description: Super Admin only. Adds an active user to the allowlist so they can sign in with Google immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCreateResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update Admin or Member
      description: Super Admin only. System Super Admin cannot be modified.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: Not found or protected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete Admin or Member
      description: Super Admin only. System Super Admin cannot be deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Not found or protected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /settings:
    get:
      operationId: getSiteSettings
      tags: [settings]
      summary: Get site settings
      description: Public settings used by the marketing site (e.g. contact phone).
      responses:
        "200":
          description: Site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
    put:
      operationId: updateSiteSettings
      tags: [settings]
      summary: Update site settings
      description: Requires staff session. Members cannot change phone or owner email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden for this role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /settings/notify-status:
    get:
      operationId: getNotifyStatus
      tags: [settings]
      summary: Email notification readiness
      description: Booleans only — never returns secrets. Used by Admin Settings readiness panel. Requires staff session.
      responses:
        "200":
          description: Notification readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifyStatus"
  /settings/hero-image:
    post:
      operationId: uploadHeroImage
      tags: [settings]
      summary: Upload homepage hero image
      description: Multipart form with image (JPEG/PNG/WebP, max 5MB). Stored in R2. Requires staff session (admin/super_admin/member).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: Hero image file
      responses:
        "200":
          description: Updated settings including new heroImageUrl
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: resetHeroImage
      tags: [settings]
      summary: Reset homepage hero image to default
      description: Clears the custom hero setting and deletes the R2 object. Requires staff session.
      responses:
        "200":
          description: Updated settings with empty heroImageUrl
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
  /gallery:
    get:
      operationId: listGalleryItems
      tags: [gallery]
      summary: List gallery items
      description: Paginated list. Published only by default; pass all=1 for admin (includes drafts).
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: string
            enum: ["0", "1"]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 12
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated gallery items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryList"
    post:
      operationId: createGalleryItem
      tags: [gallery]
      summary: Create a gallery item
      description: Multipart form with image. Unauthenticated for now — add token auth later.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/GalleryItemCreateInput"
      responses:
        "201":
          description: Gallery item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryItem"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /gallery/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: number
    delete:
      operationId: deleteGalleryItem
      tags: [gallery]
      summary: Delete a gallery item
      description: Deletes metadata and R2 image. Unauthenticated for now — add token auth later.
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /faqs:
    get:
      operationId: listFaqs
      tags: [faqs]
      summary: List FAQs
      description: Paginated list. Published only by default; pass all=1 for admin (includes drafts). Requires auth when all=1.
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: string
            enum: ["0", "1"]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 12
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated FAQs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaqList"
    post:
      operationId: createFaq
      tags: [faqs]
      summary: Create a FAQ
      description: Requires staff auth (admin, super_admin, or member).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaqInput"
      responses:
        "201":
          description: FAQ created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Faq"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /faqs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: number
    put:
      operationId: updateFaq
      tags: [faqs]
      summary: Update a FAQ
      description: Requires staff auth (admin, super_admin, or member).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaqInput"
      responses:
        "200":
          description: FAQ updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Faq"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteFaq
      tags: [faqs]
      summary: Delete a FAQ
      description: Requires staff auth (admin, super_admin, or member).
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    Faq:
      type: object
      required: [id, question, answer, sortOrder, published, createdAt, updatedAt]
      properties:
        id:
          type: number
        question:
          type: string
        answer:
          type: string
        sortOrder:
          type: number
        published:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
    FaqList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Faq"
        total:
          type: number
        limit:
          type: number
        offset:
          type: number
    FaqInput:
      type: object
      required: [question, answer]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 300
        answer:
          type: string
          minLength: 1
          maxLength: 2000
        sortOrder:
          type: number
        published:
          type: boolean
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    UserRole:
      type: string
      enum: [super_admin, admin, member]
    UserStatus:
      type: string
      enum: [invited, active, disabled]
    AdminUser:
      type: object
      required:
        - id
        - email
        - name
        - avatarUrl
        - role
        - status
        - isSystem
        - invitedBy
        - createdAt
        - updatedAt
        - lastLoginAt
      properties:
        id:
          type: number
        email:
          type: string
        name:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"
        isSystem:
          type: boolean
        invitedBy:
          type: ["number", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        lastLoginAt:
          type: ["string", "null"]
    AuthMeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
    UserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
    UserCreateInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
        role:
          type: string
          enum: [admin, member]
        name:
          type: string
    UserCreateResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
    UserUpdateInput:
      type: object
      properties:
        name:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, member]
        status:
          $ref: "#/components/schemas/UserStatus"
    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
    ServiceRequest:
      type: object
      required: [id, name, phone, service, description, status, urgency, source, photoUrls, videoUrls, createdAt, updatedAt]
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: string
        service:
          type: string
        description:
          type: string
        preferredDate:
          type: ["string", "null"]
        preferredTime:
          type: ["string", "null"]
          description: Preferred time window (morning, afternoon, evening)
        status:
          type: string
          description: pending, contacted, converted, or declined
        urgency:
          type: string
          enum: [flexible, soon, urgent]
          description: Soft priority — not a life-safety emergency dispatch
        source:
          type: string
          description: "Origin of the request: web (public form) or phone (admin-recorded)"
        photoUrls:
          type: array
          items:
            type: string
          description: Public /api/media URLs for attached photos
        videoUrls:
          type: array
          items:
            type: string
          description: Public /api/media URLs for attached videos (auto-deleted when request is declined or converted)
        jobAddress:
          type: ["string", "null"]
          description: "Full job address supplied by the customer, e.g. \"123 Oak St, Austin, TX 78701\""
        createdAt:
          type: string
        updatedAt:
          type: string
    ServiceRequestInput:
      type: object
      required: [name, email, phone, service, description]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 3
          maxLength: 120
          description: Required so the client can receive booking confirmation email
        phone:
          type: string
          minLength: 7
        service:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        urgency:
          type: string
          enum: [flexible, soon, urgent]
          default: flexible
          description: Soft priority for scheduling (default flexible)
        preferredDate:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        preferredTime:
          type: string
          enum: [morning, afternoon, evening]
        photos:
          type: array
          maxItems: 5
          description: Optional job photos (JPEG/PNG/WebP, max 5MB each)
          items:
            type: string
            format: binary
        videos:
          type: array
          maxItems: 2
          description: Optional job videos (MP4/MOV/WebM, max 100MB each); auto-deleted when request is declined or converted
          items:
            type: string
            format: binary
        jobStreet:
          type: string
          minLength: 1
          maxLength: 200
          description: Street address of the job site (e.g. 123 Oak St). Required for web bookings.
        jobCity:
          type: string
          minLength: 1
          maxLength: 100
          description: City of the job site (e.g. Austin). Required for web bookings.
        jobZip:
          type: string
          pattern: "^\\d{5}$"
          description: "5-digit Texas ZIP code. Must start with 7. Submissions with a non-Texas ZIP are rejected server-side."
    ServiceRequestUpdateInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, contacted, declined]
    ConfirmServiceRequestInput:
      type: object
      required: [scheduledDate, scheduledTime]
      properties:
        scheduledDate:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        scheduledTime:
          type: string
          enum: [morning, afternoon, evening]
        scheduledSpecificTime:
          type: ["string", "null"]
          description: Optional specific arrival time within the window (e.g. "9:00 AM")
    ConfirmServiceRequestResult:
      type: object
      required: [booking, serviceRequest, notifications]
      properties:
        booking:
          $ref: "#/components/schemas/Booking"
        serviceRequest:
          $ref: "#/components/schemas/ServiceRequest"
        notifications:
          type: object
          required: [emailSent, smsSent]
          properties:
            emailSent:
              type: boolean
            smsSent:
              type: boolean
            warning:
              type: ["string", "null"]
    ServiceRequestList:
      type: object
      required: [items, total, limit, offset, pendingCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRequest"
        total:
          type: number
        limit:
          type: number
        offset:
          type: number
        pendingCount:
          type: number
    ServiceRequestSummary:
      type: object
      required: [totalRequests, pendingCount, byService]
      properties:
        totalRequests:
          type: number
        pendingCount:
          type: number
        byService:
          type: array
          items:
            $ref: "#/components/schemas/ServiceCount"
    ServiceCount:
      type: object
      required: [service, count]
      properties:
        service:
          type: string
        count:
          type: number
    PhoneBookingInput:
      type: object
      required: [name, phone, service, description, scheduledDate, scheduledTime]
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 7
        email:
          type: string
          description: Optional — required only to send a confirmation email
        service:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        preferredDate:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        preferredTime:
          type: string
          enum: [morning, afternoon, evening]
        scheduledDate:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        scheduledTime:
          type: string
          enum: [morning, afternoon, evening]
        scheduledSpecificTime:
          type: ["string", "null"]
          description: Optional specific arrival time within the window (e.g. "9:00 AM")
    PhoneBookingResult:
      type: object
      required: [booking, notifications]
      properties:
        booking:
          $ref: "#/components/schemas/Booking"
        notifications:
          type: object
          required: [emailSent, smsSent]
          properties:
            emailSent:
              type: boolean
            smsSent:
              type: boolean
            warning:
              type: ["string", "null"]
    Booking:
      type: object
      required:
        - id
        - name
        - phone
        - service
        - description
        - scheduledDate
        - scheduledTime
        - status
        - source
        - createdAt
        - updatedAt
      properties:
        id:
          type: number
        serviceRequestId:
          type: ["number", "null"]
        name:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: string
        service:
          type: string
        description:
          type: string
        scheduledDate:
          type: string
          description: Confirmed date YYYY-MM-DD
        scheduledTime:
          type: string
          description: Confirmed time window (morning, afternoon, evening)
        scheduledSpecificTime:
          type: ["string", "null"]
          description: Optional specific arrival time within the window (e.g. "9:00 AM")
        status:
          type: string
          description: confirmed, completed, or cancelled
        source:
          type: string
          description: "Origin: web (confirmed from public request) or phone (admin-recorded)"
        createdAt:
          type: string
        updatedAt:
          type: string
    BookingUpdateInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [confirmed, completed, cancelled]
    Review:
      type: object
      required: [id, name, rating, text, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        location:
          type: ["string", "null"]
        service:
          type: ["string", "null"]
        rating:
          type: number
          minimum: 1
          maximum: 5
        text:
          type: string
        createdAt:
          type: string
        excellent:
          type: boolean
          description: "Present only on the create response: whether the review was judged excellent (used by the frontend to offer a prominent Google review handoff)."
    ReviewInput:
      type: object
      required: [name, rating, text]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        location:
          type: string
          maxLength: 80
        service:
          type: string
          maxLength: 60
        rating:
          type: number
          minimum: 1
          maximum: 5
        text:
          type: string
          minLength: 10
          maxLength: 1000
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
    ChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          description: Conversation history including the newest user message
          items:
            $ref: "#/components/schemas/ChatMessage"
        inquiryId:
          type: number
          description: Chat inquiry id from createChatInquiry; persists the transcript when set
    ChatResponse:
      type: object
      required: [reply]
      properties:
        reply:
          type: string
        inquiryOrphaned:
          type: boolean
          description: >
            True when the client sent an inquiryId that no longer exists in the
            database (stale sessionStorage). The client should clear its session
            and prompt the visitor to re-enter their name.
    ChatInquiry:
      type: object
      required: [id, name, messages, status, createdAt, updatedAt]
      properties:
        id:
          type: number
        name:
          type: string
        phone:
          type: ["string", "null"]
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        status:
          type: string
          description: Inquiry status (new, contacted, closed)
        createdAt:
          type: string
        updatedAt:
          type: string
    ChatInquiryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: string
          maxLength: 40
    ChatInquiryUpdateInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [new, contacted, closed]
    ChatInquiryList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatInquiry"
        total:
          type: number
        limit:
          type: number
        offset:
          type: number
    SiteSettings:
      type: object
      required: [phone, ownerEmail, notifyFromEmail, notifyFromName, heroImageUrl, thumbtackRating, thumbtackReviewCount, taskrabbitRating, taskrabbitReviewCount, googleReviewUrl, googlePlaceId, themeId, themeMode, fontId]
      properties:
        phone:
          type: string
          description: "Display phone number shown in the site header (also used for tel: links)"
        ownerEmail:
          type: string
          description: Owner email for new service-request alerts
        notifyFromEmail:
          type: string
          description: From address for outbound notification emails (Cloudflare Email Sending domain)
        notifyFromName:
          type: string
          description: Display name for outbound notification emails
        heroImageUrl:
          type: string
          description: Public URL for a custom homepage hero image; empty string means use the built-in default
        thumbtackRating:
          type: string
          description: "Thumbtack star rating displayed on the homepage (e.g. \"4.9\")"
        thumbtackReviewCount:
          type: string
          description: "Number of Thumbtack reviews displayed on the homepage (e.g. \"110\")"
        taskrabbitRating:
          type: string
          description: "TaskRabbit star rating displayed on the homepage (e.g. \"5.0\")"
        taskrabbitReviewCount:
          type: string
          description: "Number of TaskRabbit reviews displayed on the homepage (e.g. \"384\")"
        googleReviewUrl:
          type: string
          description: "Google review shortlink; empty string means the CTA is hidden"
        googlePlaceId:
          type: string
          description: "Google Place ID for this business; used by the daily cron to sync reviews via Places API"
        themeId:
          type: string
          description: "Active color theme (e.g. craftsman, modern)"
        themeMode:
          type: string
          enum: [light, dark]
          description: "Light or dark mode preference"
        fontId:
          type: string
          description: "Active font pairing (e.g. workhorse, classic)"
    GoogleReview:
      type: object
      required: [id, authorName, rating, text, googleTime, syncedAt]
      properties:
        id:
          type: number
        authorName:
          type: string
        authorPhotoUrl:
          type: string
          nullable: true
        rating:
          type: number
          minimum: 1
          maximum: 5
        text:
          type: string
        googleTime:
          type: number
          description: Unix timestamp from Google
        syncedAt:
          type: string
          description: ISO timestamp when this review was last synced
    SiteSettingsInput:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          minLength: 7
          maxLength: 40
        ownerEmail:
          type: string
          maxLength: 120
        notifyFromEmail:
          type: string
          maxLength: 120
        notifyFromName:
          type: string
          maxLength: 80
        thumbtackRating:
          type: string
          maxLength: 10
        thumbtackReviewCount:
          type: string
          maxLength: 20
        taskrabbitRating:
          type: string
          maxLength: 10
        taskrabbitReviewCount:
          type: string
          maxLength: 20
        googleReviewUrl:
          type: string
          maxLength: 500
        googlePlaceId:
          type: string
          maxLength: 300
        themeId:
          type: string
          maxLength: 60
          description: "Active color theme (e.g. craftsman, modern)"
        themeMode:
          type: string
          enum: [light, dark]
          description: "Light or dark mode preference"
        fontId:
          type: string
          maxLength: 60
          description: "Active font pairing (e.g. workhorse, classic)"
    NotifyStatus:
      type: object
      required:
        - ownerEmailSet
        - notifyFromEmailSet
        - emailBindingReady
        - emailReady
        - smsEnabled
      properties:
        ownerEmailSet:
          type: boolean
        notifyFromEmailSet:
          type: boolean
        emailBindingReady:
          type: boolean
        emailReady:
          type: boolean
          description: True when owner email, from email, and EMAIL binding are all ready
        smsEnabled:
          type: boolean
          description: Always false in the email-only phase (Twilio deferred)
    GalleryItem:
      type: object
      required: [id, label, alt, imageUrl, sortOrder, published, createdAt]
      properties:
        id:
          type: number
        label:
          type: string
        alt:
          type: string
        imageUrl:
          type: string
        sortOrder:
          type: number
        published:
          type: boolean
        createdAt:
          type: string
    GalleryList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GalleryItem"
        total:
          type: number
        limit:
          type: number
        offset:
          type: number
    TaskList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        total:
          type: number
        limit:
          type: number
        offset:
          type: number
    GalleryItemCreateInput:
      type: object
      required: [label, image]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        alt:
          type: string
          maxLength: 160
        sortOrder:
          type: string
          description: Numeric sort order as form field string
        published:
          type: string
          description: 1 or 0 / true or false
        image:
          type: string
          format: binary
    Task:
      type: object
      required: [id, title, beforeUrl, afterUrl, sortOrder, published, createdAt, updatedAt]
      properties:
        id:
          type: number
        title:
          type: string
        location:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        beforeUrl:
          type: string
        afterUrl:
          type: string
        sortOrder:
          type: number
        published:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
    TaskCreateInput:
      type: object
      required: [title, before, after]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        location:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 500
        sortOrder:
          type: string
          description: Numeric sort order as form field string
        published:
          type: string
          description: "1 or 0 / true or false"
        before:
          type: string
          format: binary
        after:
          type: string
          format: binary
    TaskUpdateInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        location:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 500
        sortOrder:
          type: string
        published:
          type: string
        before:
          type: string
          format: binary
        after:
          type: string
          format: binary
