<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 228 56" fill="none" role="img" aria-label="Mike's Handyman Service">
  <!-- Icon: orange circle + wrench -->
  <circle cx="28" cy="28" r="26" fill="#EA580C"/>
  <!-- House outline (white) -->
  <path d="M28 13 L43 26 L39.5 26 L39.5 43 L16.5 43 L16.5 26 L13 26 Z"
        fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
  <!-- Door -->
  <rect x="22" y="33" width="12" height="10" rx="1" fill="white" opacity="0.9"/>
  <!-- Wrench bolt (small circle at roof peak) -->
  <circle cx="28" cy="13" r="2.5" fill="white"/>
  <!-- Wrench handle diagonal -->
  <line x1="33" y1="19" x2="39" y2="25" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="64" y="24"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-weight="800" font-size="19" fill="#0F172A" letter-spacing="0.5">MIKE&#8217;S</text>
  <text x="64" y="45"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-weight="500" font-size="13" fill="#EA580C" letter-spacing="1.6">HANDYMAN SERVICE</text>
</svg>
